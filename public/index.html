<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeWebProxy</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-2: #1c2129;
    --border: #262d38;
    --text: #e6e9ef;
    --muted: #8b95a5;
    --accent: #c96442;
    --accent-2: #e07b52;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .logo {
    font-weight: 650;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .logo span { color: var(--accent); }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--muted);
    margin-left: auto;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 0 3px rgba(255,255,255,.04);
  }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  .dot.wait { background: var(--warn); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 0;
  }
  aside {
    border-right: 1px solid var(--border);
    background: var(--panel);
    padding: 18px;
    overflow-y: auto;
  }
  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .field { margin-bottom: 22px; }
  .model {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font: inherit;
  }
  .model:hover:not(:disabled) { border-color: #3a4453; }
  .model.sel {
    border-color: var(--accent);
    background: rgba(201,100,66,.10);
  }
  .model:disabled { opacity: .45; cursor: not-allowed; }
  .model .name { font-weight: 600; font-size: 13.5px; }
  .model .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .model .badge {
    display: inline-block;
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 20px;
    background: rgba(248,81,73,.15);
    color: var(--err);
    margin-left: 6px;
    vertical-align: 1px;
  }
  .levels { display: flex; flex-direction: column; gap: 6px; }
  .level {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px;
    border-radius: 9px;
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 13.5px;
  }
  .level:hover { background: var(--panel-2); }
  .level.sel { border-color: var(--accent); background: rgba(201,100,66,.10); }
  .level input { accent-color: var(--accent); margin: 0; }
  .level .ldesc { font-size: 11.5px; color: var(--muted); }

  .chat {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px clamp(16px, 6vw, 80px);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .msg { display: flex; gap: 12px; max-width: 860px; width: 100%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    flex: 0 0 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    background: var(--panel-2); color: var(--muted);
  }
  .msg.user .avatar { background: rgba(201,100,66,.18); color: var(--accent-2); }
  .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
    min-width: 0;
  }
  .msg.user .bubble { background: var(--panel-2); border-color: #2f3846; }
  .thinking {
    margin-top: 8px;
    padding: 8px 11px;
    border-left: 2px solid var(--warn);
    background: rgba(210,153,34,.07);
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    color: #c9b48a;
    white-space: pre-wrap;
  }
  .meta {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 6px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .err {
    border-color: rgba(248,81,73,.5);
    background: rgba(248,81,73,.08);
    color: #ffb4ae;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 420px;
  }
  .empty h3 { color: var(--text); font-size: 17px; margin: 0 0 8px; }
  .empty code {
    background: var(--panel-2); padding: 2px 6px; border-radius: 5px; font-size: 12.5px;
  }

  form.composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px clamp(16px, 6vw, 80px);
    display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    min-height: 46px;
    max-height: 200px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button.send {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button.send:hover:not(:disabled) { background: var(--accent-2); }
  button.send:disabled { opacity: .5; cursor: not-allowed; }
  button.clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 11px 14px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
  }
  button.clear:hover { color: var(--text); border-color: #3a4453; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">Claude<span>Web</span>Proxy</div>
  <div class="status">
    <span class="dot wait" id="dot"></span>
    <span id="statusText">проверка…</span>
  </div>
</header>

<main>
  <aside>
    <div class="field">
      <h2>Модель</h2>
      <div id="models"></div>
    </div>
    <div class="field">
      <h2>Уровень мышления</h2>
      <div class="levels" id="levels"></div>
    </div>
    <div class="field">
      <h2>Транспорт</h2>
      <div style="font-size:12.5px;color:var(--muted)" id="transport">—</div>
    </div>
  </aside>

  <section class="chat">
    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <h3>Готово к работе</h3>
        <p>Выберите модель и уровень мышления слева, затем напишите сообщение.</p>
        <p>API этого же сервера: <code>http://127.0.0.1:9656/v1</code></p>
      </div>
    </div>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Спросите Claude… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button type="button" class="clear" id="clear" title="Очистить чат">Очистить</button>
      <button type="submit" class="send" id="send">Отправить</button>
    </form>
  </section>
</main>

<script>
const state = {
  model: null,
  thinking: 'standard',
  history: [],
  sessionId: 'ui-' + Math.random().toString(36).slice(2),
  busy: false,
};

const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('input');
const sendEl = $('send');

function setStatus(kind, text) {
  $('dot').className = 'dot ' + kind;
  $('statusText').textContent = text;
}

async function loadStatus() {
  try {
    const r = await fetch('/api/ui/status');
    const s = await r.json();
    state.model = state.model || s.defaultModel;
    state.thinking = state.thinking || s.defaultThinking;
    renderModels(s.models);
    renderLevels(s.thinkingLevels);
    $('transport').textContent =
      (s.transport === 'cdp-browser' ? 'браузер (CDP)' : 'Node HTTPS') +
      (s.proxy ? ' · прокси ' + s.proxy.replace('http://', '') : '');
    const usable = s.models.filter((m) => m.available).length;
    if (s.transport === 'cdp-browser' && !s.browserConnected) {
      setStatus('err', 'браузер не подключён');
    } else {
      setStatus('ok', 'готов · ' + usable + ' модел(и)');
    }
  } catch (e) {
    setStatus('err', 'нет связи с прокси');
  }
}

function renderModels(list) {
  const box = $('models');
  box.innerHTML = '';
  for (const m of list) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'model' + (m.id === state.model ? ' sel' : '');
    b.disabled = !m.available;
    b.innerHTML =
      '<div class="name">' + m.label +
        (m.available ? '' : '<span class="badge">не в плане</span>') + '</div>' +
      '<div class="desc">' + (m.description || '') + '</div>';
    b.title = m.available ? ('claude.ai: ' + m.webModel) : (m.reason || '');
    if (m.available) {
      b.onclick = () => { state.model = m.id; renderModels(list); };
    }
    box.appendChild(b);
  }
}

function renderLevels(list) {
  const box = $('levels');
  box.innerHTML = '';
  for (const t of list) {
    const l = document.createElement('label');
    l.className = 'level' + (t.id === state.thinking ? ' sel' : '');
    l.innerHTML =
      '<input type="radio" name="thinking" value="' + t.id + '"' +
        (t.id === state.thinking ? ' checked' : '') + '>' +
      '<div><div>' + t.label + '</div><div class="ldesc">' + t.description + '</div></div>';
    l.querySelector('input').onchange = () => { state.thinking = t.id; renderLevels(list); };
    box.appendChild(l);
  }
}

function addMessage(role, text) {
  const empty = $('empty');
  if (empty) empty.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML =
    '<div class="avatar">' + (role === 'user' ? 'Я' : 'AI') + '</div>' +
    '<div><div class="bubble"></div><div class="meta"></div></div>';
  wrap.querySelector('.bubble').textContent = text || '';
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
}
inputEl.addEventListener('input', autoGrow);

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || state.busy) return;
  state.busy = true;
  sendEl.disabled = true;
  inputEl.value = '';
  autoGrow();

  addMessage('user', text);
  const reply = addMessage('assistant', '');
  const bubble = reply.querySelector('.bubble');
  const meta = reply.querySelector('.meta');
  let acc = '';
  let thinkingAcc = '';
  let thinkingBox = null;

  const started = Date.now();
  try {
    const res = await fetch('/api/ui/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        model: state.model,
        thinking: state.thinking,
        history: state.history,
        sessionId: state.sessionId,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error((err.error && err.error.message) || ('HTTP ' + res.status));
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let done = false;
    while (!done) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const evLine = part.split('\n').find((l) => l.startsWith('event: '));
        const dataLine = part.split('\n').find((l) => l.startsWith('data: '));
        if (!evLine || !dataLine) continue;
        const ev = evLine.slice(7);
        let data = {};
        try { data = JSON.parse(dataLine.slice(6)); } catch { continue; }
        if (ev === 'delta') {
          acc += data.text;
          bubble.textContent = acc;
        } else if (ev === 'thinking') {
          if (!thinkingBox) {
            thinkingBox = document.createElement('div');
            thinkingBox.className = 'thinking';
            reply.querySelector('.bubble').after(thinkingBox);
          }
          thinkingAcc += data.text;
          thinkingBox.textContent = 'Рассуждение: ' + thinkingAcc;
        } else if (ev === 'done') {
          acc = data.text || acc;
          bubble.textContent = acc;
          const secs = ((Date.now() - started) / 1000).toFixed(1);
          meta.textContent = data.model + ' · ' + state.thinking + ' · ' + secs + ' c';
          done = true;
        } else if (ev === 'error') {
          bubble.className = 'bubble err';
          bubble.textContent = 'Ошибка (' + data.type + '): ' + data.message;
          done = true;
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }
    if (acc) {
      state.history.push({ role: 'user', content: text });
      state.history.push({ role: 'assistant', content: acc });
    }
  } catch (e) {
    bubble.className = 'bubble err';
    bubble.textContent = 'Ошибка: ' + e.message;
  } finally {
    state.busy = false;
    sendEl.disabled = false;
    inputEl.focus();
  }
}

$('form').addEventListener('submit', (e) => { e.preventDefault(); sendMessage(); });
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$('clear').onclick = () => {
  state.history = [];
  state.sessionId = 'ui-' + Math.random().toString(36).slice(2);
  messagesEl.innerHTML = '<div class="empty" id="empty"><h3>Готово к работе</h3>' +
    '<p>Выберите модель и уровень мышления слева, затем напишите сообщение.</p>' +
    '<p>API этого же сервера: <code>http://127.0.0.1:9656/v1</code></p></div>';
};

loadStatus();
setInterval(loadStatus, 15000);
inputEl.focus();
</script>
</body>
</html>
